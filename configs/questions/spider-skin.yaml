  Squamous cell carcinoma: scc
  Vessels: vessels
  Wart: wart
decisions:
- qid: tissue
  type: choice
  instructions: Which tissue category best describes the central region of this skin image?
  candidates:
  - actinic_keratosis
  - apocrine_glands
  - bcc
  - scc_in_situ
  - collagen
  - epidermis
  - fat
  - follicle
  - inflammation
  - melanoma_invasive
  - kaposi
  - keratin
  - melanoma_in_situ
  - merkel
  - muscle
  - necrosis
  - nerves
  - nevus
  - sebaceous
  - seborrheic_keratosis
  - solar_elastosis
  - scc
  - vessels
  - wart
  add_other: true
- qid: present:malignant_tumour
  type: noul
  instructions: Is a malignant tumour (in situ or invasive) present?
  positive:
  - bcc
  - scc
  - scc_in_situ
  - melanoma_invasive
  - melanoma_in_situ
  - merkel
  - kaposi
- qid: present:melanocytic_lesion
  type: noul
  instructions: Is a melanocytic lesion (nevus or melanoma) present?
  positive:
  - nevus
  - melanoma_in_situ
  - melanoma_invasive
- qid: organ
  type: choice
  instructions: Which organ is this tissue from?
  candidates:
  - organ_breast
  - organ_colorectal
  - organ_lung
  - organ_skin
  - organ_stomach
  - organ_liver
  - organ_prostate
  - organ_cervix
  - organ_lymph_node
  constant_gold: organ_skin
  add_other: true
