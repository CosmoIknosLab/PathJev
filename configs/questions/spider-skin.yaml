# SPIDER-skin (HistAI; CC BY-NC 4.0). Labels = central-patch class strings from metadata.json (24 classes;
# 'Mercel cell carcinoma' and 'Kaposi’s sarcoma' are the dataset's own spellings). 'Carcinoma in situ' is
# rendered as squamous cell carcinoma in situ (cutaneous context; ASSUMED, check with a pathologist).
template_version: 1
source: spider-skin
organ: skin
reads:
- label
candidates:
  actinic_keratosis: actinic keratosis
  apocrine_glands: apocrine glands
  bcc: basal cell carcinoma
  scc_in_situ: squamous cell carcinoma in situ
  collagen: dermal collagen
  epidermis: normal epidermis
  fat: adipose tissue
  follicle: hair follicle
  inflammation: inflammation
  melanoma_invasive: invasive melanoma
  kaposi: Kaposi sarcoma
  keratin: keratin
  melanoma_in_situ: melanoma in situ
  merkel: Merkel cell carcinoma
  muscle: muscle
  necrosis: necrosis
  nerves: nerves
  nevus: melanocytic nevus
  sebaceous: sebaceous gland
  seborrheic_keratosis: seborrheic keratosis
  solar_elastosis: solar elastosis
  scc: invasive squamous cell carcinoma
  vessels: blood vessels
  wart: viral wart (verruca)
  organ_breast: breast
  organ_colorectal: colon or rectum
  organ_lung: lung
  organ_skin: skin
  organ_stomach: stomach
  organ_liver: liver
  organ_prostate: prostate
  organ_cervix: uterine cervix
  organ_lymph_node: lymph node
label_map:
  Actinic keratosis: actinic_keratosis
  Apocrine glands: apocrine_glands
  Basal cell carcinoma: bcc
  Carcinoma in situ: scc_in_situ
  Collagen: collagen
  Epidermis: epidermis
  Fat: fat
  Follicle: follicle
  Inflammation: inflammation
  Invasive melanoma: melanoma_invasive
  Kaposi’s sarcoma: kaposi
