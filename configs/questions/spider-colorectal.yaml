# SPIDER-colorectal (HistAI; CC BY-NC 4.0). Labels = central-patch class strings from metadata.json
# (HF card, 13 classes). Score maps SSL and low-grade adenoma to 'low-grade precancerous lesion'.
# Generated by the Phase 2 template script; edit by hand and keep template_version in sync.
template_version: 1
source: spider-colorectal
organ: colorectal
reads:
- label
candidates:
  adenoca_hg: adenocarcinoma, high grade
  adenoca_lg: adenocarcinoma, low grade
  adenoma_hg: adenoma with high-grade dysplasia
  adenoma_lg: adenoma with low-grade dysplasia
  fat: adipose tissue
  hyperplastic_polyp: hyperplastic polyp
  inflammation: inflammation
  mucus: mucus
  muscle: smooth muscle
  necrosis: necrosis
  ssl: sessile serrated lesion
  stroma: healthy stroma
  vessels: blood vessels
  organ_breast: breast
  organ_colorectal: colon or rectum
  organ_lung: lung
  organ_skin: skin
  organ_stomach: stomach
  organ_liver: liver
  organ_prostate: prostate
  organ_cervix: uterine cervix
  organ_lymph_node: lymph node
label_map:
  Adenocarcinoma high grade: adenoca_hg
  Adenocarcinoma low grade: adenoca_lg
  Adenoma high grade: adenoma_hg
  Adenoma low grade: adenoma_lg
  Fat: fat
  Hyperplastic polyp: hyperplastic_polyp
  Inflammation: inflammation
  Mucus: mucus
  Muscle: muscle
  Necrosis: necrosis
  Sessile serrated lesion: ssl
  Stroma healthy: stroma
  Vessels: vessels
decisions:
- qid: tissue
  type: choice
  instructions: Which tissue category best describes the central region of this colorectal image?
  candidates:
  - adenoca_hg
  - adenoca_lg
  - adenoma_hg
  - adenoma_lg
  - fat
  - hyperplastic_polyp
  - inflammation
  - mucus
  - muscle
  - necrosis
  - ssl
  - stroma
  - vessels
  add_other: true
- qid: present:neoplastic_epithelium
  type: noul
  instructions: Is neoplastic epithelium (adenoma or adenocarcinoma) present?
  positive:
  - adenoca_hg
  - adenoca_lg
  - adenoma_hg
  - adenoma_lg
- qid: present:adenocarcinoma
  type: noul
  instructions: Is adenocarcinoma present?
  positive:
  - adenoca_hg
  - adenoca_lg
- qid: neoplasia_level
  type: score
  instructions: What is the most advanced neoplastic change in the central region?
  levels:
  - id: L0
    text: no neoplastic lesion
  - id: L1
    text: low-grade precancerous lesion
  - id: L2
    text: high-grade dysplasia
  - id: L3
    text: carcinoma
  level_of:
    adenoca_hg: L3
    adenoca_lg: L3
    adenoma_hg: L2
    adenoma_lg: L1
    fat: L0
    hyperplastic_polyp: L0
    inflammation: L0
    mucus: L0
    muscle: L0
    necrosis: L0
    ssl: L1
    stroma: L0
    vessels: L0
- qid: organ
  type: choice
  instructions: Which organ is this tissue from?
  candidates:
  - organ_breast
  - organ_colorectal
  - organ_lung
  - organ_skin
  - organ_stomach
  - organ_liver
  - organ_prostate
  - organ_cervix
  - organ_lymph_node
  constant_gold: organ_colorectal
  add_other: true
